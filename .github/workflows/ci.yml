name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26: what the Docker image ships (Dockerfile). 22: the oldest version package.json "engines" allows.
        node: [22, 26]
    name: check (Node ${{ matrix.node }})
    steps:
      # Actions pinned to commit SHAs (tag in the comment); update with Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run tools:install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run depcheck
      - run: npm run test:coverage
      - run: npm run build
